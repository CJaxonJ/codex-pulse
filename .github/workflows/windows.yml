name: Windows compatibility

on:
  push:
    branches: ['codex/windows-support']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Build native Windows settings, consent and notifications
        id: native-build
        shell: powershell
        run: ./scripts/build-native-windows.ps1
      - name: Install pinned official CLI for isolated protocol acceptance
        id: cli-legacy
        if: ${{ !cancelled() && matrix.node == 22 && steps.native-build.outcome == 'success' }}
        run: |
          npm install --global @openai/codex@0.163.0-alpha.11.1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Codex installation failed.' }
          $prefix = (npm prefix --global).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Codex prefix could not be read.' }
          $binary = Join-Path $prefix 'codex.cmd'
          if (-not (Test-Path -LiteralPath $binary)) { throw 'Pinned Codex shim is missing.' }
          "CODEX_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Real Codex Windows hook review protocol (isolated config, no model)
        if: ${{ !cancelled() && matrix.node == 22 && steps.cli-legacy.outcome == 'success' }}
        run: node scripts/e2e-windows-codex-hooks.mjs
      - name: Install pinned resume-capable CLI without dropping old-version coverage
        id: cli-resume
        if: ${{ !cancelled() && matrix.node == 22 && steps.native-build.outcome == 'success' }}
        run: |
          npm install --global @openai/codex@0.166.0-alpha.5.1
          if ($LASTEXITCODE -ne 0) { throw 'Resume-capable Codex installation failed.' }
      - name: Hook review with resume-capable official CLI (isolated config, no model)
        if: ${{ !cancelled() && matrix.node == 22 && steps.cli-resume.outcome == 'success' }}
        env:
          PULSE_TEST_EXPECTED_CODEX_VERSION: 0.166.0-alpha.5.1
        run: node scripts/e2e-windows-codex-hooks.mjs
      - name: Real official queue reload after server restart (isolated rejecting provider, no real model)
        if: ${{ !cancelled() && matrix.node == 22 && steps.cli-resume.outcome == 'success' }}
        run: node scripts/e2e-windows-queue-resume.mjs
      - name: Official plugin installation and verified rollback (isolated config, no account)
        if: ${{ !cancelled() && matrix.node == 22 && steps.cli-resume.outcome == 'success' }}
        run: node scripts/e2e-plugin-operation.mjs
      - name: Bundled Windows install, rollback and history-preserving uninstall
        id: bundle-acceptance
        if: ${{ !cancelled() && matrix.node == 22 && steps.cli-resume.outcome == 'success' }}
        run: node scripts/e2e-windows-installer.mjs
      - name: Native Windows ownership, process and PowerShell recovery tests
        id: native-tests
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        # These files share a Windows desktop. Concurrency invariants are
        # exercised by the real competing processes inside individual tests.
        run: node --test --test-concurrency=1 test/atomic-file.test.mjs test/runtime-maintenance-guard.test.mjs test/windows-maintenance-recovery.test.mjs test/platform-runtime.test.mjs test/hosted-watcher-stop.test.mjs test/windows-private-directory.test.mjs test/windows-process-identity.test.mjs test/windows-owned-process.test.mjs test/windows-watcher-instance.test.mjs test/windows-background.test.mjs test/windows-background-recovery.test.mjs test/windows-startup.test.mjs test/windows-installation-lease.test.mjs test/windows-installation-transaction.test.mjs test/windows-uninstallation-transaction.test.mjs test/windows-installation-native.test.mjs test/windows-hook.test.mjs test/protection-consent.test.mjs test/native-wakeup.test.mjs test/worktree-lock-process.test.mjs test/chat-continuity-controller.test.mjs test/chat-continuity-full-chain.test.mjs
      - name: Full cross-platform regression (no hosted model or credentials)
        id: full-regression
        if: always()
        # Native UI files share one desktop. Serialize files; tests that prove
        # concurrent ownership still start multiple real processes themselves.
        run: npm test -- --test-concurrency=1
      - name: Preserve installation-validated Windows Beta candidate
        # Experimental queue acceptance remains visible as a failing check.
        # A Beta artifact still requires all native/installation regressions.
        if: ${{ !cancelled() && matrix.node == 22 && steps.bundle-acceptance.outcome == 'success' && steps.native-tests.outcome == 'success' && steps.full-regression.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-beta-bundle
          path: |
            dist/windows-*/*.zip
            dist/windows-*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Preserve native UI screenshot from this isolated test run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-ui-node-${{ matrix.node }}
          path: |
            build/windows/persistent-alert.png
            build/windows/settings.png
            build/windows/protection.png
            build/windows/setup.png
          if-no-files-found: warn
          retention-days: 7
