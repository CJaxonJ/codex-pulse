name: Windows compatibility

on:
  push:
    branches: ['codex/windows-support']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Build native Windows notification and read-only views
        shell: powershell
        run: ./scripts/build-native-windows.ps1
      - name: Native Windows process and PowerShell recovery tests
        run: node --test test/platform-runtime.test.mjs test/windows-hook.test.mjs test/protection-consent.test.mjs test/native-wakeup.test.mjs test/worktree-lock-process.test.mjs test/chat-continuity-full-chain.test.mjs
      - name: Install pinned official CLI for isolated protocol acceptance
        if: matrix.node == 22
        run: npm install --global @openai/codex@0.163.0-alpha.11.1
      - name: Real Codex Windows hook review protocol (isolated config, no model)
        if: matrix.node == 22
        run: node scripts/e2e-windows-codex-hooks.mjs
      - name: Full cross-platform regression (no hosted model or credentials)
        if: always()
        run: npm test
      - name: Preserve native UI screenshot from this isolated test run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-ui-node-${{ matrix.node }}
          path: build/windows/persistent-alert.png
          if-no-files-found: warn
          retention-days: 7
